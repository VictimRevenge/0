<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像調整アプリ</title>
    <!-- 可愛らしい丸文字フォントを読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'M PLUS Rounded 1c', sans-serif; background-color: #f8fafc; }
        .hidden-screen { display: none; }
        .screen { height: 100vh; display: flex; flex-direction: column; }
    </style>
</head>
<body>

    <!-- 1. トップページ -->
    <div id="page1" class="screen flex flex-col justify-center items-center p-6">
        <h1 class="text-3xl font-bold text-slate-700 mb-10">アプリ名をここ表示（仮）</h1>
        <button onclick="goToPage2()" class="w-64 h-64 bg-pink-400 rounded-[40px] shadow-xl flex flex-col items-center justify-center text-white text-4xl font-bold border-4 border-white active:scale-95 transition-all">
            <span>画像を</span>
            <span>えらぶ</span>
            <span>ボタン</span>
        </button>
    </div>

    <!-- 2. 写真選択ページ -->
    <div id="page2" class="screen hidden-screen p-4">
        <div class="flex-1 grid grid-cols-3 gap-2 overflow-y-auto">
            <!-- 写真フォルダのモック -->
            <div class="aspect-square bg-slate-300 rounded-lg"></div>
            <div class="aspect-square bg-slate-300 rounded-lg"></div>
            <div class="aspect-square bg-slate-300 rounded-lg"></div>
            <div class="aspect-square bg-slate-300 rounded-lg"></div>
            <div class="aspect-square bg-slate-300 rounded-lg"></div>
            <div class="aspect-square bg-slate-300 rounded-lg"></div>
        </div>
        <div class="h-20 flex gap-4 pt-4">
            <button onclick="goToPage3()" class="flex-1 bg-blue-500 rounded-2xl text-white font-bold text-xl">えらぶ</button>
            <button onclick="goToPage1()" class="flex-1 bg-slate-400 rounded-2xl text-white font-bold text-xl">やめる</button>
        </div>
    </div>

    <!-- 3. 調整ページ -->
    <div id="page3" class="screen hidden-screen">
        <div class="flex-1 bg-black flex items-center justify-center">
            <div class="w-full h-64 bg-slate-700 flex items-center justify-center text-white">画像プレビューエリア</div>
        </div>
        <div class="p-6 bg-white rounded-t-3xl shadow-2xl">
            <div class="flex justify-between items-center text-sm font-bold mb-4">
                <span class="text-blue-500">−（数字はっきり）</span>
                <span class="text-slate-500">現状</span>
                <span class="text-emerald-500">＋（数字ぼかす）</span>
            </div>
            <input type="range" class="w-full h-4 accent-pink-500">
        </div>
    </div>

    <script>
        function showPage(id) {
            document.getElementById('page1').classList.add('hidden-screen');
            document.getElementById('page2').classList.add('hidden-screen');
            document.getElementById('page3').classList.add('hidden-screen');
            document.getElementById(id).classList.remove('hidden-screen');
        }
        function goToPage1() { showPage('page1'); }
        function goToPage2() { showPage('page2'); }
        function goToPage3() { showPage('page3'); }
    </script>
</body>
</html>
