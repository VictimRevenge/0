<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像調整アプリ</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'M PLUS Rounded 1c', sans-serif; background-color: white; color: black; }
        .hidden-screen { display: none !important; }
        .screen { min-height: 100vh; display: flex; flex-direction: column; }
        
        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(1.15); }
        }
        .blinking-icon {
            display: inline-block;
            animation: blink 0.8s infinite ease-in-out;
        }

        .btn-push {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-push:active {
            transform: scale(0.93);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>

    <!-- 1. トップページ -->
    <div id="page1" class="screen flex flex-col justify-center items-center p-6">
        <h1 class="text-3xl font-bold mb-10">アプリ名をここ表示（仮）</h1>
        
        <input type="file" id="imageInput" accept="image/jpeg, image/png" class="hidden" onchange="handleImageSelect(event)">
        
        <button onclick="triggerFileInput()" class="btn-push w-64 h-64 bg-red-500 rounded-full shadow-xl flex flex-col items-center justify-center text-white text-4xl font-bold">
            <span>画像を</span>
            <span>えらぶ</span>
            <span>ボタン</span>
        </button>
    </div>

    <!-- 2. 写真選択ページ -->
    <div id="page2" class="screen hidden-screen p-4">
        <div class="flex-1 flex items-center justify-center bg-slate-200 rounded-lg overflow-hidden">
            <img id="previewImage" class="max-w-full max-h-[60vh] object-contain" alt="プレビュー">
        </div>
        <div class="h-20 flex gap-4 pt-4">
            <button onclick="processAndGoToPage3()" class="btn-push flex-1 bg-blue-500 rounded-2xl text-white font-bold text-xl">えらぶ</button>
            <button onclick="goToPage1()" class="btn-push flex-1 bg-slate-300 rounded-2xl text-black font-bold text-xl">やめる</button>
        </div>
    </div>

    <!-- 3. 調整ページ -->
    <div id="page3" class="screen hidden-screen flex flex-col">
        <div class="flex-1 bg-slate-700 flex items-center justify-center overflow-hidden p-2">
            <img id="adjustPreviewImage" class="max-w-full max-h-full object-contain" alt="調整プレビュー">
        </div>
        <div class="p-6 bg-white rounded-t-3xl shadow-2xl">
            <div class="flex justify-between items-center text-sm font-bold mb-4">
                <span class="text-blue-500">−（数字はっきり）</span>
                <span class="text-slate-500">現状</span>
                <span class="text-slate-700">＋（数字ぼかす）</span>
            </div>
            <!-- カーネル設定：最小1、最大55、初期値（中間）27（奇数） -->
            <input type="range" id="mosaicSlider" min="1" max="55" value="27" oninput="applyBlurEffect()" class="w-full h-4 accent-red-500">
            
            <button onclick="goToPage4()" class="btn-push w-full mt-6 py-3 bg-red-500 text-white font-bold text-xl rounded-2xl shadow-lg">
                決定する
            </button>
        </div>
    </div>

    <!-- 4. 保存ページ -->
    <div id="page4" class="screen hidden-screen p-6 flex flex-col justify-center items-center">
        <h2 class="text-2xl font-bold mb-6 text-slate-800">保存設定</h2>
        <div class="w-full max-w-xs flex flex-col gap-5">
            <div>
                <button onclick="saveImage(true)" class="btn-push w-full py-4 bg-blue-500 text-white font-bold rounded-2xl text-lg shadow-md">
                    位置情報ありで保存
                </button>
                <p class="text-xs text-slate-500 mt-1 text-center font-bold">警察へ証拠を見せるため</p>
            </div>
            
            <div>
                <button onclick="saveImage(false)" class="btn-push w-full py-4 bg-slate-600 text-white font-bold rounded-2xl text-lg shadow-md">
                    位置情報なしで保存
                </button>
                <p class="text-xs text-slate-500 mt-1 text-center font-bold">当事者以外を守るため</p>
            </div>

            <button onclick="goToPage3()" class="btn-push w-full py-3 bg-slate-300 text-black font-bold rounded-2xl text-base mt-2">
                戻る
            </button>
        </div>
    </div>

    <!-- 読み込み中表示画面 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/40 hidden flex flex-col items-center justify-center z-50 p-6">
        <div class="bg-white text-slate-800 px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-2 text-lg font-bold">
            <span id="loadingMessage">画像かスクショをモザイクできます</span>
            <span class="blinking-icon text-2xl">👍</span>
        </div>
    </div>

    <canvas id="processCanvas" class="hidden"></canvas>

    <script>
        let selectedImageFile = null;
        let processedDataUrl = null;

        function triggerFileInput() {
            document.getElementById('imageInput').click();
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                showLoading("画像かスクショをモザイクできます");
                selectedImageFile = file;
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    document.getElementById('previewImage').src = e.target.result;
                    setTimeout(() => {
                        hideLoading();
                        showPage('page2');
                    }, 200);
                };
                
                reader.readAsDataURL(file);
            }
        }

        // コアプログラム仕様に基づくフロントエンド用プレビュー生成処理
        function processAndGoToPage3() {
            if (!selectedImageFile) return;

            showLoading("ただいま基本モザイク加工中");

            setTimeout(() => {
                const img = new Image();
                img.src = document.getElementById('previewImage').src;
                img.onload = function() {
                    const canvas = document.getElementById('processCanvas');
                    const ctx = canvas.getContext('2d');
                    
                    let w = img.width;
                    let h = img.height;
                    const maxDim = 800;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) {
                            h = Math.round(h * (maxDim / w));
                            w = maxDim;
                        } else {
                            w = Math.round(w * (maxDim / h));
                            h = maxDim;
                        }
                    }

                    canvas.width = w;
                    canvas.height = h;

                    // 1. 背景処理（ノイズ強度25・粒サイズ4倍・反転・グレー50%などコア設定を再現）
                    ctx.drawImage(img, 0, 0, w, h);

                    const imageData = ctx.getImageData(0, 0, w, h);
                    const data = imageData.data;
                    // ノイズ粒サイズ4倍をシミュレート
                    for (let y = 0; y < h; y += 4) {
                        for (let x = 0; x < w; x += 4) {
                            const noise = (Math.random() - 0.5) * 50;
                            for (let dy = 0; dy < 4 && y + dy < h; dy++) {
                                for (let dx = 0; dx < 4 && x + dx < w; dx++) {
                                    const idx = ((y + dy) * w + (x + dx)) * 4;
                                    data[idx] = Math.min(255, Math.max(0, data[idx] + noise));
                                    data[idx+1] = Math.min(255, Math.max(0, data[idx+1] + noise));
                                    data[idx+2] = Math.min(255, Math.max(0, data[idx+2] + noise));
                                }
                            }
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);

                    // 色反転とグレー50%重ね合わせ
                    ctx.globalCompositeOperation = 'difference';
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, w, h);

                    processedDataUrl = canvas.toDataURL();
                    document.getElementById('adjustPreviewImage').src = processedDataUrl;

                    hideLoading();
                    showPage('page3');
                };
            }, 200);
        }

        // スライダー（1〜55、初期値27、奇数）によるぼかし調整
        function applyBlurEffect() {
            const val = document.getElementById('mosaicSlider').value;
            const blurPx = (val / 55) * 14;
            document.getElementById('adjustPreviewImage').style.filter = `blur(${blurPx}px)`;
        }

        function saveImage(keepLocation) {
            const msg = keepLocation ? '位置情報ありで保存しました（警察提出用）' : '位置情報なしで保存しました（プライバシー保護用）';
            alert(msg);
            // 実際のダウンロード処理
            const a = document.createElement('a');
            a.href = document.getElementById('adjustPreviewImage').src;
            a.download = keepLocation ? 'protected_with_location.png' : 'protected_no_location.png';
            a.click();
        }

        function showLoading(msg) {
            document.getElementById('loadingMessage').innerText = msg;
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        function showPage(id) {
            document.getElementById('page1').classList.add('hidden-screen');
            document.getElementById('page2').classList.add('hidden-screen');
            document.getElementById('page3').classList.add('hidden-screen');
            document.getElementById('page4').classList.add('hidden-screen');
            document.getElementById(id).classList.remove('hidden-screen');
        }

        function goToPage1() { 
            document.getElementById('imageInput').value = '';
            selectedImageFile = null;
            showPage('page1'); 
        }
        function goToPage2() { showPage('page2'); }
        function goToPage3() { showPage('page3'); }
        function goToPage4() { showPage('page4'); }
    </script>
</body>
</html>
